# Боевое развёртывание ovirt-backup.
#
#   ./install.sh   — подготовит .env и запустит; спросит, чем именно
#
# Здесь только боевой вариант. Ознакомительного с готовыми паролями нет
# намеренно: конфигурация, которую «пока не трогаем, потом заменим», остаётся
# в бою чаще, чем заменяется, а отличить её от настоящей по журналу нельзя.
#
# Обязательные переменные не имеют значений по умолчанию: без deploy/.env
# compose откажется запускаться и назовёт, чего не хватает. Это лучше, чем
# подняться с паролем jhvirt и выглядеть работающей установкой.
#
# Установщик задаёт пароль первого администратора до запуска и печатает его
# после readiness-проверки, не оставляя в .env.

# version нужен ради docker-compose v1: без него он разбирает файл по схеме
# первой версии, где нет ключа services. Docker Compose v2 поле игнорирует и
# предупреждает, что оно устарело, — это ожидаемо.
#
# Именно 2.4, а не 3.x: в третьей схеме нет depends_on с condition, а он здесь
# нужен — сервис не должен стартовать раньше готовой базы.
version: "2.4"

# Имя проекта задаётся через COMPOSE_PROJECT_NAME в .env: верхнеуровневый ключ
# name понимает Compose v2, но docker-compose v1 отказывается разбирать.
services:
  ovirt-backup:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: ovirt-backup:${VERSION:-dev}
    restart: unless-stopped
    # Служба пишет журнал дважды: в файл (его ротацию настраивает оператор из
    # интерфейса) и в поток, который забирает docker. У драйвера json-file по
    # умолчанию предела нет вовсе, и вторая копия растёт на системном разделе
    # хоста, пока он не кончится. Предел здесь — не тонкая настройка, а замена
    # отсутствующей.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "${JHV_PORT:-8080}:8080"
    environment:
      JHV_SERVER_ADDR: "0.0.0.0"
      JHV_SERVER_PORT: "8080"
      # Обязателен: из него выводится флаг Secure у куки сессии. Умолчание
      # http://localhost означало бы куку без Secure в боевой установке за
      # обратным прокси — ровно там, где она нужнее всего.
      JHV_SERVER_EXTERNAL_URL: "${JHV_EXTERNAL_URL:?задайте в deploy/.env, например https://virt.example.org}"
      # Собственный TLS приложения. Сертификат и ключ установщик хранит внутри
      # jhvirt-data с владельцем UID 10001, поэтому закрытый ключ не приходится
      # делать доступным всем пользователям хоста. При reverse proxy оставьте
      # false: внешний URL при этом всё равно может быть https://.
      JHV_SERVER_TLS_ENABLED: "${JHV_TLS_ENABLED:-false}"
      JHV_SERVER_TLS_CERT_FILE: "${JHV_TLS_CERT_FILE:-/app/data/tls/server.crt}"
      JHV_SERVER_TLS_KEY_FILE: "${JHV_TLS_KEY_FILE:-/app/data/tls/server.key}"
      # Подключение к базе задаётся раздельными переменными, а не собранной
      # здесь строкой: вложенная подстановка вида ${A:-…${B:?…}…} расходится
      # между Compose v1 и v2. Раздельные переменные понимают обе версии, и
      # пароль в них не нуждается в экранировании.
      #
      # Имя хоста postgres — это имя службы ниже.
      JHV_DATABASE_POSTGRES_HOST: "postgres"
      JHV_DATABASE_POSTGRES_PORT: "5432"
      JHV_DATABASE_POSTGRES_USER: "${POSTGRES_USER:?задайте в deploy/.env}"
      JHV_DATABASE_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?задайте в deploy/.env, сгенерируйте openssl rand -base64 24}"
      JHV_DATABASE_POSTGRES_DATABASE: "${POSTGRES_DB:?задайте в deploy/.env}"
      # База стоит рядом, в сети контейнеров: наружу этот трафик не выходит,
      # и своего TLS у образа postgres нет. prefer означает «зашифровать,
      # если сервер умеет» — здесь он не умеет, и соединение остаётся
      # открытым внутри сети docker.
      #
      # Меняйте вместе с JHV_DATABASE_URL, когда база вынесена наружу: со
      # значением disable служба туда просто не подключится и скажет почему.
      JHV_DATABASE_POSTGRES_SSLMODE: "${JHV_DATABASE_SSLMODE:-prefer}"
      # Внешняя база вместо поднятой рядом: если задан, перекрывает всё выше.
      JHV_DATABASE_URL: "${JHV_DATABASE_URL:-}"
      JHV_SECRETS_KEY_FILE: "/app/data/secret.key"
      # Временные файлы — рядом с восстановлением, а не в томе с данными.
      # Восстановление без указанного каталога назначения пишет образ именно
      # сюда, а проверка разворачивает здесь цепочку целиком: это десятки и
      # сотни гигабайт. Том с данными живёт на системном разделе хоста, и
      # заполнить его — значит остановить не службу, а весь хост: на забитом
      # корне перестают писать и systemd, и docker, и журналы, по которым потом
      # разбираются, что случилось.
      JHV_BACKUP_TEMP_DIR: "/restores/.tmp"
      # Каталоги, куда разрешено восстанавливать образы. Путь приходит от
      # клиента, поэтому список закрыт; temp_dir разрешён всегда. Значения —
      # пути внутри контейнера, и каждый из них должен быть смонтирован ниже.
      JHV_BACKUP_RESTORE_DIRS: "${JHV_RESTORE_DIRS:-/restores}"
      # Журнал — в том с данными, а не в слой контейнера.
      #
      # Пустым это значение оставлять нельзя, хотя выглядит оно безобидно:
      # viper считает пустую переменную незаданной и берёт значение из файла
      # настроек, а там стоит ./logs/jhvirt.log — то есть /app/logs внутри
      # контейнера. Каталог этот лежит в слое, исчезает при каждом пересоздании
      # вместе со всей историей, а при read_only ниже ещё и недоступен для
      # записи. Раньше здесь стояло пустое значение с комментарием «журнал
      # уходит в поток» — он был неверен, журнал всё это время писался в слой.
      #
      # Путь обязан быть внутри /app/data: только этот каталог переживает
      # пересоздание. Он же нужен просмотру журнала из интерфейса — потока
      # docker интерфейс не видит, ему нужен файл.
      JHV_LOGGING_FORMAT: "json"
      JHV_LOGGING_FILE: "${JHV_LOG_FILE:-/app/data/logs/jhvirt.log}"
      # Межсайтовые запросы к API по умолчанию не разрешены никому, и пустое
      # значение здесь ничего не «затирает»: viper считает пустую переменную
      # незаданной и берёт список из файла. Безопасное значение обеспечивается
      # тем, что в самом файле список пуст. Заполнять, только если интерфейс
      # раздаётся с другого адреса.
      JHV_SERVER_CORS_ORIGINS: "${JHV_CORS_ORIGINS:-}"
      JHV_SCHEDULER_TIMEZONE: "${TZ:-UTC}"
      # Авто-восстановление по умолчанию только фиксирует намеченные действия.
      # Отключите dry_run, когда убедитесь по журналу, что решения верные.
      JHV_MONITOR_REMEDIATION_DRY_RUN: "${JHV_REMEDIATION_DRY_RUN:-true}"
      # Пароль первого администратора; пусто — будет сгенерирован и напечатан.
      JHV_AUTH_BOOTSTRAP_PASSWORD: "${JHV_ADMIN_PASSWORD:-}"
      # Вход через внешнего провайдера (Keycloak и совместимые).
      #
      # Соответствие групп ролям — auth.oidc.role_mapping — здесь задать
      # нельзя: это словарь, а viper не собирает словарь из переменной
      # окружения. Он и всё прочее, чего нет в этом списке, задаётся в файле
      # настроек (см. JHV_CONFIG_FILE ниже).
      JHV_AUTH_OIDC_ENABLED: "${JHV_OIDC_ENABLED:-false}"
      JHV_AUTH_OIDC_ISSUER: "${JHV_OIDC_ISSUER:-}"
      JHV_AUTH_OIDC_CLIENT_ID: "${JHV_OIDC_CLIENT_ID:-}"
      # Секрет — только через .env: файл настроек лежит в репозитории.
      JHV_AUTH_OIDC_CLIENT_SECRET: "${JHV_OIDC_CLIENT_SECRET:-}"
      # Задаётся целиком и обязателен при включённом внешнем входе: провайдер
      # сверяет его побуквенно. Собирать его здесь из внешнего адреса нельзя —
      # вложенная подстановка расходится между версиями Compose (см. выше про
      # подключение к базе). Вид: https://virt.example.org/api/v1/auth/oidc/callback
      JHV_AUTH_OIDC_REDIRECT_URL: "${JHV_OIDC_REDIRECT_URL:-}"
      JHV_AUTH_OIDC_BUTTON_LABEL: "${JHV_OIDC_BUTTON_LABEL:-}"
      JHV_AUTH_OIDC_GROUPS_CLAIM: "${JHV_OIDC_GROUPS_CLAIM:-groups}"
      # Пусто — вошедшему без подходящей группы отказано во входе.
      JHV_AUTH_OIDC_DEFAULT_ROLE: "${JHV_OIDC_DEFAULT_ROLE:-}"
      JHV_AUTH_OIDC_POST_LOGOUT_REDIRECT_URL: "${JHV_OIDC_POST_LOGOUT_URL:-}"
      JHV_AUTH_OIDC_SESSION_TTL: "${JHV_OIDC_SESSION_TTL:-1h}"
      # Вход по паролю рядом с внешним. Выключать не рекомендуется: локальная
      # запись администратора — путь внутрь, когда провайдер недоступен.
      JHV_AUTH_OIDC_ALLOW_LOCAL_LOGIN: "${JHV_OIDC_ALLOW_LOCAL_LOGIN:-true}"
      JHV_METRICS_ENABLED: "${JHV_METRICS_ENABLED:-false}"
      JHV_METRICS_TOKEN_FILE: "/app/data/metrics.token"
      TZ: "${TZ:-UTC}"
    volumes:
      # Файл настроек. По умолчанию — тот же, что запечён в образ, поэтому
      # умолчание ничего не меняет: подставляется ровно то, что и так было
      # внутри.
      #
      # Нужен он затем, что не всякую настройку можно задать переменной
      # окружения: auth.oidc.role_mapping — словарь, а viper словари из
      # переменных не собирает. Через этот файл соответствие групп ролям
      # меняется без пересборки образа — достаточно `docker compose up -d`.
      #
      # Файл читается поверх встроенных умолчаний, так что менять в нём нужно
      # только свои настройки. Правка файла из репозитория поссорит его с
      # `git pull`; чтобы этого избежать, положите свой экземпляр вне
      # репозитория и укажите путь в JHV_CONFIG_FILE.
      - ${JHV_CONFIG_FILE:-../config/ovirt-backup.yaml}:/app/config/ovirt-backup.yaml:ro
      # Ключ шифрования секретов и временные файлы. Терять нельзя: без
      # secret.key не расшифровать ни пароли подключений, ни копии.
      - jhvirt-data:/app/data
      # Каталог для локального хранилища бэкапов. Смонтируйте сюда NFS-шару,
      # если бэкапы должны уезжать на отдельную СХД.
      - ${JHV_BACKUP_DIR:-./backups}:/backups
      # Куда складываются восстановленные образы. Отдельно от хранилища копий
      # намеренно: восстановление не должно съедать место под сами копии.
      - ${JHV_RESTORE_DIR:-./restores}:/restores
    # Столько же, сколько в юните systemd: восстановление и проверка держат
    # много открытых объектов хранилища. На хостах, где предел по умолчанию
    # равен 1024, без этого проверка большой цепочки упирается в него.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # Ограничения контейнера.
    #
    # Служба ходит на чужие движки виртуализации с правами администратора и
    # держит ключ, которым расшифровываются копии. Взлом её процесса не должен
    # превращаться ещё и во взлом хоста — эти четыре строки и есть разница
    # между «залезли в приложение» и «залезли в приложение и вышли наружу».
    #
    # read_only делает корень образа неизменяемым. Данные от этого не
    # страдают: всё, что служба пишет, лежит в томах ниже, а они монтируются
    # поверх и остаются доступными для записи.
    read_only: true
    # /tmp нужен даже при заданном backup.temp_dir: при проверке копии без
    # указанного каталога код падает обратно на os.TempDir(), и без tmpfs это
    # была бы попытка записи в корень, доступный только для чтения. Размер
    # ограничен намеренно — иначе он растёт в памяти хоста без предела.
    tmpfs:
      - /tmp:size=256m,mode=1777
    # Ни одна из привилегий ядра службе не нужна: работает она от uid 10001 и
    # слушает порт выше 1024.
    cap_drop:
      - ALL
    # Запрещает получить больше прав, чем есть, через setuid-программу внутри
    # контейнера. Обычный первый шаг после захвата процесса.
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "${JHV_TLS_ENABLED:-false}" = "true" ]; then
            wget --no-check-certificate -qO- https://127.0.0.1:8080/healthz;
          else
            wget -qO- http://127.0.0.1:8080/healthz;
          fi
      interval: 30s
      timeout: 5s
      retries: 3
      # Столько же, сколько в HEALTHCHECK образа. Без отсрочки первые секунды —
      # миграции и создание учётной записи — контейнер числится unhealthy, и
      # свежая установка выглядит сломанной, хотя всё идёт по плану.
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    # См. выше: у json-file без опций предела нет, а база на каждой контрольной
    # точке пишет строку.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?задайте в deploy/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?задайте в deploy/.env}"
      POSTGRES_DB: "${POSTGRES_DB:?задайте в deploy/.env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data

    # Здесь ограничение только одно, и это не забывчивость.
    #
    # Образ postgres стартует от root: он выставляет владельца каталогу данных
    # и лишь потом переключается на своего пользователя. Снятие привилегий и
    # read_only ломают именно этот шаг, и подбирать для него точный набор
    # cap_add нужно с проверкой на стенде — на пустом томе и на уже
    # существующем, потому что ведут они себя по-разному. Строка, добавленная
    # без такой проверки, обнаружится в момент, когда база не поднимется, а
    # это всегда самый неудобный момент.
    #
    # no-new-privileges безопасен при любом раскладе: он не отбирает прав, а
    # запрещает получить новые.
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak — необязательная часть установки.
  #
  # Поднимается только при COMPOSE_PROFILES=keycloak; эту переменную ставит
  # установщик, если выбрать «поднять Keycloak рядом». Без неё служба работает
  # ровно как раньше, с входом по паролю, и образ Keycloak даже не скачивается.
  #
  # Переменные ниже заданы с умолчаниями, а не через :? — подстановка идёт при
  # разборе файла, до отбора по профилям, и обязательные значения ломали бы
  # запуск установок, которым Keycloak не нужен.
  keycloak:
    profiles: ["keycloak"]
    # Версия закреплена. Раньше здесь стоял latest с припиской «закрепите
    # свою» — приписка ничего не закрепляет, а latest однажды приезжает со
    # сменой мажорной версии, и провайдер входа перестаёт пускать в систему
    # ровно в тот момент, когда кто-то просто пересоздал контейнеры.
    #
    # Поднимается версия отдельным решением, после проверки на стенде.
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.7}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["start", "--http-enabled=true", "--hostname-strict=false"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      # Адрес, по которому Keycloak виден браузеру. Он же попадает в issuer
      # выданных токенов, поэтому браузер и служба обязаны звать его одинаково:
      # разные адреса — разные issuer, и проверка токена не сойдётся.
      KC_HOSTNAME: "${JHV_KEYCLOAK_URL:-}"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HEALTH_ENABLED: "true"
      # Своя база в том же кластере: заводит её установщик, потому что
      # docker-entrypoint-initdb.d отрабатывает только на пустом томе, а том
      # здесь чаще всего уже существует.
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}"
      KC_DB_USERNAME: "${POSTGRES_USER:-}"
      KC_DB_PASSWORD: "${POSTGRES_PASSWORD:-}"
      # Учётная запись администратора Keycloak создаётся один раз, при первом
      # запуске с пустой базой. Установщик печатает пароль и стирает его из
      # .env — как и пароль администратора самой службы.
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USER:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-}"
      TZ: "${TZ:-UTC}"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  jhvirt-data:
  postgres-data:
