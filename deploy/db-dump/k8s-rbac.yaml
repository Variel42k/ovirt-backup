# Учётная запись хелпера jhvirt-db-dump для СУБД в Kubernetes.
#
# Права — только в пространстве имён СУБД: найти под и выполнить в нём
# команду. Читать секреты, менять или удалять объекты учётная запись не может.
# Замените shop на своё пространство имён.
#
#   kubectl apply -f k8s-rbac.yaml
#   kubectl -n shop create token jhvirt-db-dump --duration=8760h
#
# Токен положите в kubeconfig пользователя хелпера (~/.kube/config, владелец —
# этот пользователь, права 0600). Срок токена ограничен: заведите напоминание
# о его замене или используйте долгоживущий Secret типа
# kubernetes.io/service-account-token по правилам вашей организации.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jhvirt-db-dump
  namespace: shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jhvirt-db-dump
  namespace: shop
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jhvirt-db-dump
  namespace: shop
subjects:
  - kind: ServiceAccount
    name: jhvirt-db-dump
    namespace: shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jhvirt-db-dump
