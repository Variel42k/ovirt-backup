# Развёртывание justhpc-virt-manager в Docker.
#
#   docker compose up -d                 — сервис на SQLite, локальные копии
#   docker compose --profile s3 up -d    — плюс MinIO для проверки сценариев с S3
#
# На PostgreSQL — профиль поднимает базу, JHV_DATABASE_URL переключает на неё
# сервис. Обе строки в deploy/.env:
#
#   POSTGRES_PASSWORD=…
#   JHV_DATABASE_URL=postgres://jhvirt:…@postgres:5432/jhvirt?sslmode=disable
#
#   docker compose --profile postgres up -d
#
# Куда подключились — видно в журнале при старте, отдельным полем «подключение».
#
# Пароль первого администратора выводится в журнал при первом запуске:
#   docker compose logs justhpc-virt-manager | grep -i "УЧЁТНАЯ ЗАПИСЬ"

name: justhpc-virt-manager

services:
  justhpc-virt-manager:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: justhpc-virt-manager:${VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${JHV_PORT:-8080}:8080"
    environment:
      JHV_SERVER_ADDR: "0.0.0.0"
      JHV_SERVER_PORT: "8080"
      JHV_SERVER_EXTERNAL_URL: "${JHV_EXTERNAL_URL:-http://localhost:8080}"
      # СУБД задаётся одной строкой: она же выбирает драйвер. Раньше драйвер и
      # параметры подключения жили в разных переменных и могли разойтись —
      # забыть про driver значило тихо остаться на SQLite при поднятом
      # PostgreSQL. Здесь такого состояния нет.
      #
      #   sqlite:///app/data/jhvirt.db                       (по умолчанию)
      #   postgres://jhvirt:пароль@postgres:5432/jhvirt?sslmode=disable
      #
      # Имя хоста postgres — это имя службы ниже.
      JHV_DATABASE_URL: "${JHV_DATABASE_URL:-sqlite:///app/data/jhvirt.db}"
      JHV_SECRETS_KEY_FILE: "/app/data/secret.key"
      JHV_BACKUP_TEMP_DIR: "/app/data/tmp"
      # Каталоги, куда разрешено восстанавливать образы. Путь приходит от
      # клиента, поэтому список закрыт; temp_dir разрешён всегда. Значения —
      # пути внутри контейнера, и каждый из них должен быть смонтирован ниже.
      JHV_BACKUP_RESTORE_DIRS: "${JHV_RESTORE_DIRS:-/restores}"
      # Пусто — в контейнере это правильно: журнал уходит в поток и его
      # забирает docker logs. Просмотр журнала из интерфейса при этом
      # недоступен — ему нужен файл. Нужен просмотр: /app/logs/jhvirt.log
      # (каталог уже в томе с данными).
      JHV_LOGGING_FORMAT: "json"
      JHV_LOGGING_FILE: "${JHV_LOG_FILE:-}"
      # Адреса dev-сервера интерфейса из конфигурации по умолчанию в бою не
      # нужны: страница на localhost:9000 у оператора иначе сможет обращаться
      # к API с его куками.
      JHV_SERVER_CORS_ORIGINS: "${JHV_CORS_ORIGINS:-}"
      JHV_SCHEDULER_TIMEZONE: "${TZ:-Europe/Moscow}"
      # Авто-восстановление по умолчанию только фиксирует намеченные действия.
      # Отключите dry_run, когда убедитесь по журналу, что решения верные.
      JHV_MONITOR_REMEDIATION_DRY_RUN: "${JHV_REMEDIATION_DRY_RUN:-true}"
      # Пароль первого администратора; пусто — будет сгенерирован и напечатан.
      JHV_AUTH_BOOTSTRAP_PASSWORD: "${JHV_ADMIN_PASSWORD:-}"
      TZ: "${TZ:-Europe/Moscow}"
    volumes:
      # Ключ шифрования секретов, база SQLite и временные файлы. Терять нельзя:
      # без secret.key не расшифровать ни пароли подключений, ни копии.
      - jhvirt-data:/app/data
      # Каталог для локального хранилища бэкапов. Смонтируйте сюда NFS-шару,
      # если бэкапы должны уезжать на отдельную СХД.
      - ${JHV_BACKUP_DIR:-./backups}:/backups
      # Куда складываются восстановленные образы. Отдельно от хранилища копий
      # намеренно: восстановление не должно съедать место под сами копии.
      - ${JHV_RESTORE_DIR:-./restores}:/restores
    # Столько же, сколько в юните systemd: восстановление и проверка держат
    # много открытых объектов хранилища. На хостах, где предел по умолчанию
    # равен 1024, без этого проверка большой цепочки упирается в него.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # Объектное хранилище для проверки сценариев с S3 без облака.
  # Консоль: http://localhost:9001 (minioadmin / minioadmin-secret)
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:-minioadmin-secret}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Создаёт bucket, чтобы хранилище можно было подключить сразу после старта.
  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_USER:-minioadmin} ${MINIO_PASSWORD:-minioadmin-secret} &&
      mc mb --ignore-existing local/jhvirt-backups &&
      echo 'bucket jhvirt-backups готов'
      "

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-jhvirt}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-jhvirt}"
      POSTGRES_DB: "${POSTGRES_DB:-jhvirt}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jhvirt}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jhvirt-data:
  minio-data:
  postgres-data:
