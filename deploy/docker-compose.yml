# Боевое развёртывание justhpc-virt-manager.
#
#   cp .env.example .env   # заполнить
#   docker compose up -d
#
# Здесь только боевой вариант. Ознакомительного с готовыми паролями нет
# намеренно: конфигурация, которую «пока не трогаем, потом заменим», остаётся
# в бою чаще, чем заменяется, а отличить её от настоящей по журналу нельзя.
#
# Обязательные переменные не имеют значений по умолчанию: без deploy/.env
# compose откажется запускаться и назовёт, чего не хватает. Это лучше, чем
# подняться с паролем jhvirt и выглядеть работающей установкой.
#
# Пароль первого администратора выводится в журнал при первом запуске:
#   docker compose logs justhpc-virt-manager | grep -i "УЧЁТНАЯ ЗАПИСЬ"

# version нужен ради docker-compose v1: без него он разбирает файл по схеме
# первой версии, где нет ключа services. Docker Compose v2 и podman-compose это
# поле игнорируют (v2 предупредит, что оно устарело, — это ожидаемо).
#
# Именно 2.4, а не 3.x: в третьей схеме нет depends_on с condition, а он здесь
# нужен — сервис не должен стартовать раньше готовой базы.
version: "2.4"

# Имя проекта задаётся через COMPOSE_PROJECT_NAME в .env, а не ключом name:
# сверху. Ключ name понимают только docker compose v2 и podman-compose, а
# docker-compose v1 на нём отказывается разбирать файл целиком.
services:
  justhpc-virt-manager:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: justhpc-virt-manager:${VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${JHV_PORT:-8080}:8080"
    environment:
      JHV_SERVER_ADDR: "0.0.0.0"
      JHV_SERVER_PORT: "8080"
      # Обязателен: из него выводится флаг Secure у куки сессии. Умолчание
      # http://localhost означало бы куку без Secure в боевой установке за
      # обратным прокси — ровно там, где она нужнее всего.
      JHV_SERVER_EXTERNAL_URL: "${JHV_EXTERNAL_URL:?задайте в deploy/.env, например https://virt.example.org}"
      # Подключение к базе задаётся раздельными переменными, а не собранной
      # здесь строкой: сборка требовала вложенной подстановки вида
      # ${A:-…${B:?…}…}, которую понимает docker compose, но не всякая его
      # замена — а на RHEL это обычно podman. Раздельные переменные читает
      # любая реализация, и пароль в них не нуждается в экранировании.
      #
      # Имя хоста postgres — это имя службы ниже.
      JHV_DATABASE_POSTGRES_HOST: "postgres"
      JHV_DATABASE_POSTGRES_PORT: "5432"
      JHV_DATABASE_POSTGRES_USER: "${POSTGRES_USER:?задайте в deploy/.env}"
      JHV_DATABASE_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?задайте в deploy/.env, сгенерируйте openssl rand -base64 24}"
      JHV_DATABASE_POSTGRES_DATABASE: "${POSTGRES_DB:?задайте в deploy/.env}"
      JHV_DATABASE_POSTGRES_SSLMODE: "disable"
      # Внешняя база вместо поднятой рядом: если задан, перекрывает всё выше.
      JHV_DATABASE_URL: "${JHV_DATABASE_URL:-}"
      JHV_SECRETS_KEY_FILE: "/app/data/secret.key"
      JHV_BACKUP_TEMP_DIR: "/app/data/tmp"
      # Каталоги, куда разрешено восстанавливать образы. Путь приходит от
      # клиента, поэтому список закрыт; temp_dir разрешён всегда. Значения —
      # пути внутри контейнера, и каждый из них должен быть смонтирован ниже.
      JHV_BACKUP_RESTORE_DIRS: "${JHV_RESTORE_DIRS:-/restores}"
      # Пусто — в контейнере это правильно: журнал уходит в поток и его
      # забирает docker logs. Просмотр журнала из интерфейса при этом
      # недоступен — ему нужен файл. Нужен просмотр: /app/logs/jhvirt.log
      # (каталог уже в томе с данными).
      JHV_LOGGING_FORMAT: "json"
      JHV_LOGGING_FILE: "${JHV_LOG_FILE:-}"
      # Межсайтовые запросы к API по умолчанию не разрешены никому, и пустое
      # значение здесь ничего не «затирает»: viper считает пустую переменную
      # незаданной и берёт список из файла. Безопасное значение обеспечивается
      # тем, что в самом файле список пуст. Заполнять, только если интерфейс
      # раздаётся с другого адреса.
      JHV_SERVER_CORS_ORIGINS: "${JHV_CORS_ORIGINS:-}"
      JHV_SCHEDULER_TIMEZONE: "${TZ:-Europe/Moscow}"
      # Авто-восстановление по умолчанию только фиксирует намеченные действия.
      # Отключите dry_run, когда убедитесь по журналу, что решения верные.
      JHV_MONITOR_REMEDIATION_DRY_RUN: "${JHV_REMEDIATION_DRY_RUN:-true}"
      # Пароль первого администратора; пусто — будет сгенерирован и напечатан.
      JHV_AUTH_BOOTSTRAP_PASSWORD: "${JHV_ADMIN_PASSWORD:-}"
      TZ: "${TZ:-Europe/Moscow}"
    volumes:
      # Ключ шифрования секретов и временные файлы. Терять нельзя: без
      # secret.key не расшифровать ни пароли подключений, ни копии.
      - jhvirt-data:/app/data
      # Каталог для локального хранилища бэкапов. Смонтируйте сюда NFS-шару,
      # если бэкапы должны уезжать на отдельную СХД.
      - ${JHV_BACKUP_DIR:-./backups}:/backups
      # Куда складываются восстановленные образы. Отдельно от хранилища копий
      # намеренно: восстановление не должно съедать место под сами копии.
      - ${JHV_RESTORE_DIR:-./restores}:/restores
    # Столько же, сколько в юните systemd: восстановление и проверка держат
    # много открытых объектов хранилища. На хостах, где предел по умолчанию
    # равен 1024, без этого проверка большой цепочки упирается в него.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?задайте в deploy/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?задайте в deploy/.env}"
      POSTGRES_DB: "${POSTGRES_DB:?задайте в deploy/.env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jhvirt-data:
  postgres-data:
