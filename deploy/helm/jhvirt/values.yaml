# Чарт использует внешнюю PostgreSQL. Управляйте ей отдельно или через оператор
# и храните DSN в существующем Secret.
replicaCount: 1

image:
  repository: ovirt-backup
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Публичный URL для браузера. Обычно TLS завершается на Ingress.
externalURL: ""
timezone: UTC

database:
  existingSecret: ""
  urlKey: url

# Secret должен содержать постоянный ключ AES для шифрования учётных данных
# и чанков бэкапов. Ключ из 32 байтов кодируется в base64 (openssl rand -base64 32).
appSecret:
  existingSecret: ""
  keyKey: secret.key
  bootstrapPasswordKey: ""
  oidcClientSecretKey: ""
  metricsTokenKey: ""

# Объединяется со встроенными настройками приложения. Дополняйте словари,
# в том числе auth.oidc.role_mapping и доверенные прокси, отдельным файлом values.
config:
  server:
    serve_spa: true
  database:
    run_migrations_on_startup: true
  cluster:
    leader_election: true
    poll_interval: 15s
  logging:
    level: info
    format: json
    file: ""
  backup:
    temp_dir: /work
    restore_dirs: []
  monitor:
    remediation:
      archive_dir: /app/data/remediation-archives
  disaster_recovery:
    enabled: false

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: jhvirt.example.org
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits: {}

# Локальное хранилище по умолчанию выключено. Для нескольких реплик
# у PVC должен быть режим ReadWriteMany, подтверждённый значением shared=true.
backupStorage:
  enabled: false
  shared: false
  existingClaim: ""
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 100Gi
  annotations: {}

workVolume:
  sizeLimit: ""

terminationGracePeriodSeconds: 300

startupProbe:
  failureThreshold: 60
  periodSeconds: 5
  timeoutSeconds: 3
readinessProbe:
  failureThreshold: 3
  periodSeconds: 10
  timeoutSeconds: 5
livenessProbe:
  failureThreshold: 3
  periodSeconds: 20
  timeoutSeconds: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

extraEnv: []

