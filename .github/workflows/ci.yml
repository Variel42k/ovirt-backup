# Проверки на каждый push и pull request.
#
# Гоняется та же самая `./run check`, что и на машине разработчика: fmt, vet,
# тесты, проверка типов интерфейса. Отдельного набора команд для CI нет
# намеренно — расходятся они молча, и тогда «на моей машине проходит» перестаёт
# что-либо значить.
#
# За день работы дважды ломалось незаметно (кэш оболочки, стёртая
# конфигурация), а ложное оповещение прожило пять дней. Это и есть то, ради
# чего здесь автоматика.

name: Проверки

on:
  push:
    branches: [main]
  pull_request:

# Незаконченный прогон устаревшего коммита никому не нужен.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Сборка, тесты, типы
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # Тестам хранилища нужна настоящая PostgreSQL: они заводят себе по базе
      # на пакет и применяют миграции целиком. Версия и порт — те же, что
      # поднимает `./run test-db start`, чтобы строка подключения совпадала
      # с локальной.
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: jhvirt
          POSTGRES_PASSWORD: jhvirt
          POSTGRES_DB: jhvirt_test
        ports:
          - 55432:5432
        # Имя базы в проверке живости обязательно: без него pg_isready берёт
        # базу по имени пользователя, её нет, и сервер каждые пять секунд
        # пишет в журнал FATAL. Проверка при этом проходит — сервер ведь
        # ответил, — а в журнале остаётся шум, среди которого настоящий сбой
        # уже не разглядеть.
        options: >-
          --health-cmd "pg_isready -U jhvirt -d jhvirt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Версия берётся из go.mod: разъехаться им нельзя.
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Действующая LTS-линия; та же, что в Dockerfile.
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Без node_modules `./run check` молча пропускает проверку типов.
      - name: Зависимости интерфейса
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: ./run check
        env:
          JHV_TEST_POSTGRES_DSN: host=localhost port=55432 user=jhvirt password=jhvirt dbname=jhvirt_test sslmode=disable
        run: ./run check

      # `./run check` форматирует код на месте (gofmt -w), а не жалуется на
      # него. Поэтому неотформатированное ловится здесь: после проверок дерево
      # обязано остаться прежним.
      - name: Дерево не изменилось
        run: git diff --exit-code

      - name: Сборка интерфейса
        working-directory: web
        run: npm run build:fast

  image:
    name: Образ
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Сборка образа от обычного пользователя. Ровно так на стенде вылезло,
      # что в контекст попадают каталоги с примонтированными дисками: из-под
      # root это не проявлялось, и дефект жил незамеченным.
      - name: docker build
        run: docker build -t ovirt-backup:ci .

  vuln:
    name: Состав и уязвимости
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Готовые бинари, а не сборка из исходников. ./run умеет и так, и так, и
      # запасной путь через модульный прокси заведён ради сетей, где GitHub
      # недоступен. Здесь это раннер самого GitHub, а сборка трёх больших
      # проектов заняла бы дольше всего остального прогона вместе взятого.
      #
      # Версии читаются из ./run: второй список версий рядом с первым однажды
      # разойдётся, и разойдётся молча.
      - name: Сканеры
        run: |
          set -eu
          eval "$(sed -n 's/^\(SYFT_VERSION\|GRYPE_VERSION\|TRIVY_VERSION\)=/\1=/p' run)"
          curl -sSfL -o /tmp/syft-install.sh \
            https://raw.githubusercontent.com/anchore/syft/12d5544b2a5155969efac881c3a6f1ccace0fc2f/install.sh
          curl -sSfL -o /tmp/grype-install.sh \
            https://raw.githubusercontent.com/anchore/grype/f6f2ce0a2293e65c97bf5468926cb0c9ddad822f/install.sh
          curl -sSfL -o /tmp/trivy-install.sh \
            https://raw.githubusercontent.com/aquasecurity/trivy/e1fd17a0ea4a8cf24bc4b4dd7e2cfbf4bb31b994/contrib/install.sh
          printf '%s  %s\n' \
            ea054f8b6754db17d34129482ecda1ab733cadab57c1c9202bbe98eb5fe18d24 /tmp/syft-install.sh \
            8646f06a90b10ca64992c1809b4aa00c44e30b4f551f63c309b0b0ab66873556 /tmp/grype-install.sh \
            e00df553be558995b994758bc8995956554a16937f456dc6615b0cc411bfec7a /tmp/trivy-install.sh | sha256sum -c -
          sh /tmp/syft-install.sh -b /usr/local/bin "$SYFT_VERSION"
          sh /tmp/grype-install.sh -b /usr/local/bin "$GRYPE_VERSION"
          sh /tmp/trivy-install.sh -b /usr/local/bin "$TRIVY_VERSION"
          rm -f /tmp/syft-install.sh /tmp/grype-install.sh /tmp/trivy-install.sh

      # Образ собирается заново, хотя рядом есть задача «Образ». Намеренно:
      # та проверяет, что сборка вообще проходит, и должна падать отдельно и
      # быстро, а эта смотрит, что внутри. Между задачами образ иначе не
      # передать — только через реестр, которого здесь нет.
      #
      # Имя образа берётся из версии, как и в built_image() внутри ./run:
      # соберёт эту же команду, найдёт этот же образ.
      - name: Образ для проверки содержимого
        run: ./run docker

      # Та же команда, что на машине разработчика. Инструменты она соберёт
      # сама через модульный прокси: ставить их отдельными действиями значило
      # бы завести второй список версий, который однажды разойдётся с первым.
      - name: ./run vuln
        run: ./run vuln

      # Состав выкладывается всегда, в том числе когда проверка нашла
      # уязвимость: разбираться в находке без списка того, что установлено,
      # заметно дольше. Он же — то, что прикладывают к поставке.
      - name: Состав зависимостей
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: dist/sbom/*.cdx.json
          if-no-files-found: warn
          retention-days: 90
